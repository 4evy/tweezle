name: Nix

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    name: Flake check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          enable_kvm: true
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the flake
        run: nix flake check --print-build-logs

  javascript-check:
    name: TypeScript and embedded JavaScript
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Typecheck and verify embedded runtime scripts
        shell: bash
        run: |
          source_dir="$PWD"
          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT
          git archive HEAD | tar -x -C "$work_dir"
          cd "$work_dir"
          bun install --frozen-lockfile --ignore-scripts
          bun run typecheck

          runtimes=(addons/foundation/{sites,firefox}/runtime)
          for runtime in "${runtimes[@]}"; do
            rm -rf "$runtime/generated"
          done
          bun run sites:generate
          for runtime in "${runtimes[@]}"; do
            diff -ru "$source_dir/$runtime/generated" "$runtime/generated"
          done
